<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Task Planner — Private Access</title>
  <link rel="icon" type="image/png" href="icon.png" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.045) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }
    .private-card {
      position: relative;
      z-index: 1;
      max-width: 440px;
      width: 100%;
      background: #111114;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 44px 32px;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }
    .logo {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      margin-bottom: 22px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.25);
      padding: 3px 12px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      color: #f4f4f5;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #71717a;
      margin-bottom: 24px;
    }
    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 20px 0;
    }
    .contact-note {
      font-size: 12px;
      color: #a1a1aa;
    }
    .contact-link {
      color: #10b981;
      text-decoration: none;
      font-weight: 600;
    }
    .contact-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="private-card">
    <img src="icon.png" alt="Daily Task Planner" class="logo" />
    <br />
    <span class="badge">🔒 Private / Under Maintenance</span>
    <h1>Access Restricted</h1>
    <p>Daily Task Planner is currently undergoing private updates and is not publicly available for download.</p>
    <div class="divider"></div>
    <div class="contact-note">
      For inquiries or early access, contact <a class="contact-link" href="mailto:utkarsh2172006@gmail.com">utkarsh2172006@gmail.com</a>
    </div>
  </div>
</body>
</html>
